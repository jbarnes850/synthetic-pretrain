project:
  name: self-improving-thinking-midtraining
  seed: 1337

runtime:
  image: nvcr.io/nvidia/pytorch:26.01-py3
  workdir: /workspace
  hf_home: /hf
  model_root: /models
  device: cuda
  dtype: bfloat16
  num_workers: 0

data:
  fineweb_edu_repo_cache: /hf/hub/datasets--HuggingFaceFW--fineweb-edu
  fineweb_edu_subset: sample/10BT
  tokenizer_repo_cache: /hf/hub/models--Qwen--Qwen3.5-0.8B-Base
  config_repo_cache: /hf/hub/models--Qwen--Qwen3.5-0.8B-Base
  processed_dir: data/processed
  examples_jsonl: data/processed/pretraining_examples.jsonl
  raw_examples_jsonl: data/processed/pretraining_examples.jsonl
  max_examples: 2048
  raw_max_examples: 2048
  val_fraction: 0.05
  prefix_tokens: 384
  suffix_tokens: 128
  min_source_tokens: 640
  fineweb_max_parquet_files: 2

model:
  vocab_size: null
  hidden_size: null
  intermediate_size: null
  num_hidden_layers: null
  num_attention_heads: null
  num_key_value_heads: null
  max_position_embeddings: null
  tie_word_embeddings: null

train:
  condition: raw_ntp
  output_dir: outputs/raw_ntp
  max_steps: 200
  eval_every: 50
  save_every: 0
  batch_size: 4
  grad_accum_steps: 4
  learning_rate: 0.0003
  weight_decay: 0.1
  warmup_steps: 40
  max_grad_norm: 1.0
  log_every: 10
  generation_eval_examples: 8

selection:
  mode: judge
  judge_endpoint: http://127.0.0.1:30000
  judge_model: qwen36-35b-a3b
  prompt_path: prompts/judge_quality.txt
  prompt_version: quality_v1
  judge_repeats: 3
  judge_temperature: 0.7
  judge_top_p: 0.6
  judge_max_tokens: 64
  judge_retries: 2

keep_rule:
  max_raw_loss_regression: 0.05
  min_judge_win_abs_gain: 0.03
  max_repetition_relative_regression: 0.25
  min_available_mem_gib: 4.0
