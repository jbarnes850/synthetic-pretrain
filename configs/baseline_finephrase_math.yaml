include: configs/base.yaml

train:
  condition: finephrase_math_ntp
  output_dir: outputs/baseline_finephrase_math
  max_steps: 1000
  eval_every: 100
  batch_size: 4
  grad_accum_steps: 4
  learning_rate: 0.0002
  warmup_steps: 40

selection:
  mode: fixed
  fixed_choice: finephrase
  candidates:
    - finephrase
