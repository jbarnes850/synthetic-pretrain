include: configs/base.yaml

project:
  seed: 1337

train:
  condition: raw_ntp
  output_dir: outputs/ddp_smoke_96M
  max_steps: 20
  eval_every: 10
  log_every: 5
  save_every: 0
  batch_size: 2
  grad_accum_steps: 1
  warmup_steps: 5
  learning_rate: 0.0003

data:
  max_examples: 128
  raw_max_examples: 128
  max_parquet_files: 2
  fineweb_max_parquet_files: 1
  examples_jsonl: data/processed/ddp_smoke_96M_examples.jsonl
  raw_examples_jsonl: data/processed/ddp_smoke_96M_raw_examples.jsonl
  selected_jsonl: data/processed/ddp_smoke_96M_selected.jsonl
