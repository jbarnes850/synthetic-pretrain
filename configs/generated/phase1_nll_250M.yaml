include: configs/base.yaml

project:
  seed: 1337

model:
  hidden_size: 768
  intermediate_size: 2048
  num_hidden_layers: 20
  num_attention_heads: 12
  num_key_value_heads: 3
  max_position_embeddings: 1024

train:
  condition: raw_ntp
  output_dir: outputs/phase1_nll_250M
  max_steps: 20000
  eval_every: 1000
  log_every: 50
  save_every: 2500
  batch_size: 8
  grad_accum_steps: 16
  learning_rate: 0.0005
  warmup_steps: 2000
  weight_decay: 0.1
  max_grad_norm: 1.0

data:
  max_examples: 500000
  raw_max_examples: 500000
  max_parquet_files: 25
  fineweb_max_parquet_files: 25
  examples_jsonl: data/processed/phase1_examples.jsonl
  raw_examples_jsonl: data/processed/phase1_raw_examples.jsonl
  selected_jsonl: data/processed/phase1_selected.jsonl
