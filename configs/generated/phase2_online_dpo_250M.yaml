include: configs/generated/phase1_nll_250M.yaml

# Phase 2: Continual pretraining + Online DPO + K=16 full-pairwise judging.
# Paper: Tan et al. 2026 "Self-Improving Pretraining", §1.2.2 continual.
# Champion row in Table 6: "Online DPO (suffix vs 16 rollouts)" using full
# pairwise over the {original_suffix, 16 rollouts} pool (p.8, p.13).

project:
  seed: 2337

train:
  condition: online_dpo_selfimproving
  # Phase 1 hit its val_loss minimum around step 9000 (3.591), then regressed
  # due to data reuse (~3.6 epochs over 256M unique tokens at step 10000).
  # step_10000.pt is the closest saved checkpoint to the val minimum and is
  # the optimal warm-start for Phase 2. Phase 1 was aborted at step ~14250
  # once val regression was confirmed.
  init_from_checkpoint: outputs/phase1_nll_250M/step_10000.pt
  output_dir: outputs/phase2_dpo_250M

  # Paper §1.2.2 continual: 2000 steps, lr=5e-6, warmup=100, min_ratio=0.1.
  max_steps: 2000
  eval_every: 500
  log_every: 50
  save_every: 500
  learning_rate: 0.000005
  warmup_steps: 100
  min_lr_ratio: 0.1
  weight_decay: 0.1
  max_grad_norm: 1.0

  # Single-node effective batch 16 (= 4 micro x 4 accum). Paper uses 256 on
  # 64 GPUs; we're compute-limited. Main effect is fewer gradient updates
  # per unit data — acceptable for a scale-down replication.
  batch_size: 4
  grad_accum_steps: 4

  # Online DPO hyperparameters.
  dpo_beta: 0.1
  num_rollouts: 16

selection:
  # Judge server is launched separately (scripts/run_judge_role_mode.sh).
  # JUDGE_ENDPOINT env var overrides this at runtime. judge_model matches
  # the SGLang served name.
  judge_endpoint: http://192.168.100.10:30000
  judge_model: qwen-judge
  prompt_path: prompts/judge_quality.txt
  prompt_version: quality_v1

  # Full pairwise: judge_pairwise_batch is called once per pair, single
  # judgment per pair. judge_repeats is unused in the online_dpo path
  # (kept here only for schema compatibility with other conditions).
  judge_repeats: 1
  judge_temperature: 0.7
  judge_top_p: 0.6
  judge_max_tokens: 64
  judge_retries: 2
  judge_max_workers: 100

  # Paper §1.2.2 continual: rollouts generated at T=1.0, top_p=1.0.
  rollout_temperature: 1.0
  rollout_top_p: 1.0
