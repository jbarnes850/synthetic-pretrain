include: configs/base.yaml

# Self-improving continued pretraining with Online DPO + K=16 full pairwise, from
# Qwen3-0.6B-Base (public pretrained). Same paper recipe as Phase 2, but with
# a properly pretrained base instead of our from-scratch 270M. This matches
# the paper's actual champion setup (continual from Llama2-1.4B).

project:
  seed: 3337

# Null out cfg.model overrides — build_model uses from_pretrained path and
# inherits Qwen3-0.6B-Base's native dimensions (hidden=1024, layers=28,
# heads=16, kv_heads=8, intermediate=3072).
model:
  hidden_size: null
  intermediate_size: null
  num_hidden_layers: null
  num_attention_heads: null
  num_key_value_heads: null
  max_position_embeddings: null
  tie_word_embeddings: null

train:
  condition: online_dpo_selfimproving
  # Mounted inside container at /hf (synpre-flash:2509 mounts ~/.cache/huggingface → /hf)
  init_from_pretrained: /hf/hub/models--Qwen--Qwen3-0.6B-Base/snapshots/da87bfb608c14b7cf20ba1ce41287e8de496c0cd
  output_dir: outputs/self_improving_pretraining

  # Paper §1.2.2 continual: 2000 steps, lr=5e-6, warmup=100, min_ratio=0.1.
  max_steps: 2000
  eval_every: 500
  log_every: 50
  save_every: 500
  learning_rate: 0.000005
  warmup_steps: 100
  min_lr_ratio: 0.1
  weight_decay: 0.1
  max_grad_norm: 1.0

  batch_size: 4
  grad_accum_steps: 4

  dpo_beta: 0.1
  num_rollouts: 16

data:
  # Reuse the materialized pretraining chunks. The tokenizer vocabulary was
  # verified byte-compatible with Qwen3-0.6B-Base for this experiment.
  max_examples: 500000
  raw_max_examples: 500000
  max_parquet_files: 25
  fineweb_max_parquet_files: 25
  examples_jsonl: data/processed/phase1_examples.jsonl
  raw_examples_jsonl: data/processed/phase1_raw_examples.jsonl
  selected_jsonl: data/processed/phase1_selected.jsonl

selection:
  judge_endpoint: http://127.0.0.1:30000
  judge_model: qwen-judge
  prompt_path: prompts/judge_quality.txt
  prompt_version: quality_v1
  judge_repeats: 1
  judge_temperature: 0.7
  judge_top_p: 0.6
  judge_max_tokens: 64
  judge_retries: 2
  judge_max_workers: 100
  rollout_temperature: 1.0
  rollout_top_p: 1.0
