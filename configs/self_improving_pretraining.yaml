include: configs/base.yaml

# Self-Improving Pretraining continued-pretraining stage.
# Follows the paper's Online DPO suffix-vs-K-rollouts branch: for each prefix,
# compare the original suffix against K policy rollouts with a strong judge,
# then train on chosen/rejected continuations.

project:
  seed: 8337

runtime:
  dtype: bfloat16
  device: cuda

model:
  hidden_size: null
  intermediate_size: null
  num_hidden_layers: null
  num_attention_heads: null
  num_key_value_heads: null
  max_position_embeddings: null
  tie_word_embeddings: null

train:
  condition: online_dpo_selfimproving
  init_from_pretrained: /hf/hub/models--Qwen--Qwen3.5-0.8B-Base
  output_dir: outputs/self_improving_pretraining
  max_steps: 3000
  eval_every: 500
  log_every: 25
  save_every: 500
  learning_rate: 0.000005
  warmup_steps: 100
  min_lr_ratio: 0.1
  weight_decay: 0.1
  max_grad_norm: 1.0
  batch_size: 4
  grad_accum_steps: 4
  dpo_beta: 0.1
  num_rollouts: 16

data:
  tokenizer_repo_cache: /hf/hub/models--Qwen--Qwen3.5-0.8B-Base
  config_repo_cache: /hf/hub/models--Qwen--Qwen3.5-0.8B-Base
  fineweb_edu_repo_cache: /hf/hub/datasets--HuggingFaceFW--fineweb-edu
  fineweb_edu_subset: sample/10BT
  processed_dir: data/processed
  materialize_paired: false
  max_examples: 0
  raw_max_examples: 1000000
  val_fraction: 0.05
  prefix_tokens: 384
  suffix_tokens: 128
  min_source_tokens: 640
  fineweb_max_parquet_files: 100
  examples_jsonl: data/processed/pretraining_examples.jsonl
  raw_examples_jsonl: data/processed/pretraining_examples.jsonl
  online_dpo_examples_jsonl: data/processed/pretraining_examples.jsonl

selection:
  judge_endpoint: http://127.0.0.1:30000
  judge_model: qwen36-35b-a3b
  prompt_path: prompts/judge_quality.txt
  prompt_version: quality_v1
  judge_repeats: 1
  judge_temperature: 0.7
  judge_top_p: 0.6
  judge_max_tokens: 64
  judge_retries: 2
  judge_max_workers: 100
  rollout_temperature: 1.0
  rollout_top_p: 1.0
