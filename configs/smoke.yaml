include: configs/base.yaml

data:
  max_examples: 128
  raw_max_examples: 128
  max_parquet_files: 1
  pretraining_sources:
    - name: dclm
      repo_cache: /hf/hub/datasets--mlfoundations--dclm-baseline-1.0-parquet
      path_glob: "**/*.parquet"
      max_parquet_files: 1
      weight: 0.70
      text_column: text
    - name: finemath
      repo_cache: /hf/hub/datasets--HuggingFaceTB--finemath
      subset: finemath-3plus
      path_glob: "**/*.parquet"
      max_parquet_files: 1
      weight: 0.30
      text_column: text
  prefix_tokens: 128
  suffix_tokens: 64
  min_source_tokens: 220

model:
  hidden_size: 256
  intermediate_size: 768
  num_hidden_layers: 2
  num_attention_heads: 4
  num_key_value_heads: 2
  max_position_embeddings: 512

train:
  condition: raw_ntp
  output_dir: outputs/smoke
  max_steps: 10
  eval_every: 5
  batch_size: 2
  grad_accum_steps: 1
  learning_rate: 0.0008
  warmup_steps: 2

selection:
  mode: fixed
  fixed_choice: original
  candidates:
    - original
