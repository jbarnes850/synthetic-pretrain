include: configs/base.yaml

# RAM Thinking Mid-training SFT arm initialized from the base model.
# Trains with next-token prediction on the SFT split of the interleaved corpus.

project:
  seed: 9337

runtime:
  dtype: bfloat16
  device: cuda

model:
  hidden_size: null
  intermediate_size: null
  num_hidden_layers: null
  num_attention_heads: null
  num_key_value_heads: null
  max_position_embeddings: null
  tie_word_embeddings: null

train:
  condition: interleaved_thinking_sft
  init_from_pretrained: /hf/hub/models--Qwen--Qwen3.5-0.8B-Base
  output_dir: outputs/thinking_sft_base
  max_steps: 2048
  eval_every: 256
  log_every: 32
  save_every: 512
  learning_rate: 0.000005
  warmup_steps: 100
  min_lr_ratio: 0.1
  weight_decay: 0.1
  max_grad_norm: 1.0
  batch_size: 4
  grad_accum_steps: 4

data:
  tokenizer_repo_cache: /hf/hub/models--Qwen--Qwen3.5-0.8B-Base
  config_repo_cache: /hf/hub/models--Qwen--Qwen3.5-0.8B-Base
  examples_jsonl: data/processed/interleaved_thinking_sft.jsonl
  raw_examples_jsonl: data/processed/interleaved_thinking_sft.jsonl
  interleaved_thinking_examples_jsonl: data/processed/interleaved_thinking_sft.jsonl
  heldout_examples_jsonl: data/processed/interleaved_thinking_heldout.jsonl
