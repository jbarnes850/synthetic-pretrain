include: configs/base.yaml

# Treatment: self-improved checkpoint SFT on the same interleaved
# teacher-thought data.

project:
  seed: 4337

model:
  hidden_size: null
  intermediate_size: null
  num_hidden_layers: null
  num_attention_heads: null
  num_key_value_heads: null
  max_position_embeddings: null
  tie_word_embeddings: null

train:
  condition: interleaved_thinking_sft
  init_from_pretrained: /hf/hub/models--Qwen--Qwen3-0.6B-Base/snapshots/da87bfb608c14b7cf20ba1ce41287e8de496c0cd
  init_from_checkpoint: outputs/self_improving_pretraining/final.pt
  output_dir: outputs/thinking_sft_self_improved
  max_steps: 512
  eval_every: 128
  log_every: 32
  save_every: 256
  learning_rate: 0.000005
  warmup_steps: 50
  min_lr_ratio: 0.1
  weight_decay: 0.1
  max_grad_norm: 1.0
  batch_size: 4
  grad_accum_steps: 4

data:
  examples_jsonl: data/processed/interleaved_thinking.jsonl
  raw_examples_jsonl: data/processed/interleaved_thinking.jsonl
  selected_jsonl: data/processed/interleaved_thinking.jsonl
  thinking_examples_jsonl: data/processed/interleaved_thinking.jsonl
  interleaved_thinking_examples_jsonl: data/processed/interleaved_thinking.jsonl
